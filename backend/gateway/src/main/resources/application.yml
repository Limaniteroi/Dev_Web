server:
  port: ${GATEWAY_PORT:8080}
spring:
  application.name: gateway
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD:app}
    publisher-confirm-type: correlated
    publisher-returns: true
  jackson:
    default-property-inclusion: non_null
management.endpoints.web.exposure.include: health,info
app:
  messaging:
    questions-exchange: perguntas.exchange
    questions-queue: perguntas.queue
    questions-routing-key: perguntas.nova
    answers-exchange: respostas.exchange
    answers-queue: respostas.queue
    answers-routing-key: respostas.pronta
  websocket.allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
