server:
  port: ${GATEWAY_PORT:8080}
  # Ao desligar, espera as requisições em andamento terminarem
  shutdown: graceful

spring:
  application.name: gateway
  # Lê backend/.env (se existir) tanto rodando da pasta backend quanto da pasta do módulo
  config.import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD:app}
    # Confirmação do broker a cada publicação (QuestionPublisher usa waitForConfirmsOrDie)
    publisher-confirm-type: simple
    listener.simple:
      acknowledge-mode: auto
      prefetch: 10
      default-requeue-rejected: false
  jackson:
    default-property-inclusion: non_null
  mvc.async.request-timeout: -1  # o timeout do SSE é controlado pelo próprio SseEmitter

management.endpoints.web.exposure.include: health,info

app:
  messaging:
    questions-exchange: perguntas.exchange
    questions-queue: perguntas.queue
    questions-routing-key: perguntas.nova
    questions-dead-letter-exchange: perguntas.dlx
    questions-dead-letter-queue: perguntas.dlq
    answers-exchange: respostas.exchange
    answers-queue: respostas.queue
    # Routing key por usuário: respostas.<userId>; respostas.queue usa o binding respostas.#
    answers-routing-key-prefix: respostas
  security:
    # Em produção, defina JWT_SECRET (>= 32 caracteres) no .env
    jwt-secret: ${JWT_SECRET:troque-este-segredo-de-desenvolvimento-com-32+chars}
    jwt-ttl: ${JWT_TTL:8h}
    users:
      - username: aluno
        password: ${DEMO_PASSWORD:senha123}
      - username: professor
        password: ${DEMO_PASSWORD:senha123}
  cors:
    # Lista separada por vírgula. Só é usada quando o front-end chama o Gateway direto (sem proxy).
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  rate-limit:
    questions-per-minute: ${RATE_LIMIT_PER_MINUTE:5}
    max-pending: ${RATE_LIMIT_MAX_PENDING:3}
    max-question-length: 2000
  sse:
    timeout: 30m
    heartbeat: 15000  # ms
  history:
    retention: 24h
