server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        # $http_host mantém a porta (127.0.0.1:3000). Com $host a porta some, o Spring
        # passa a ver Origin != Host e trata a chamada como cross-origin (CORS 403).
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # SSE: entrega cada evento imediatamente e mantém a conexão longa aberta
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
