server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS interno do Docker. Com o endereço numa variável, o nginx resolve "gateway" de novo
    # a cada 10 s; sem isso ele guardaria o IP da inicialização e daria 502 se o container
    # do Gateway fosse recriado (novo IP).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream http://gateway:8080;

    location /api/ {
        proxy_pass $gateway_upstream;
        proxy_http_version 1.1;
        # $http_host mantém a porta (127.0.0.1:3000). Com $host a porta some, o Spring
        # passa a ver Origin != Host e trata a chamada como cross-origin (CORS 403).
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # SSE: entrega cada evento imediatamente e mantém a conexão longa aberta
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
